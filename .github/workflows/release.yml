name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - scripts/upload-release.ps1
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer and update metadata
        run: npm run dist

      - name: Publish versioned release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/upload-release.ps1
